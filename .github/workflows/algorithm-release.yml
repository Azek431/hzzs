name: Publish official algorithm pack

# push algorithm-packs on main → auto PATCH if content changed → sign + release-index
# Default mirror: GitHub only. Optional dual-publish if GITEE_TOKEN is set.
# Required Secrets: ALGORITHM_SIGNING_PRIVATE_KEY_B64, ALGORITHM_SIGNING_KEY_ID

on:
  push:
    branches: [main]
    paths:
      - "algorithm-packs/**"
      - "tools/algorithm/**"
      - ".github/workflows/algorithm-release.yml"
  workflow_dispatch:
    inputs:
      source_dir:
        description: Single pack under algorithm-packs/ (empty = all packs with manifest)
        required: false
        default: ""
      channel:
        description: Force channel (auto = each pack manifest.channel)
        required: false
        default: auto
        type: choice
        options:
          - auto
          - stable
          - beta
      execute:
        description: Network publish (false = dry-run only)
        required: true
        default: true
        type: boolean
      mirrors:
        description: github and/or gitee
        required: false
        default: github
        type: choice
        options:
          - github
          - github,gitee
          - gitee

permissions:
  contents: write

concurrency:
  group: algorithm-release-main
  cancel-in-progress: false

env:
  REPO_OWNER: Azek431
  REPO_NAME: hzzs

jobs:
  publish-algorithm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet cryptography requests

      - name: Unit tests
        run: python3 -m unittest discover -s tools/algorithm/tests -v

      - name: Prepare auto-bump and publish
        env:
          ALGORITHM_SIGNING_PRIVATE_KEY_B64: ${{ secrets.ALGORITHM_SIGNING_PRIVATE_KEY_B64 }}
          ALGORITHM_SIGNING_KEY_ID: ${{ secrets.ALGORITHM_SIGNING_KEY_ID }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SOURCE: ${{ github.event.inputs.source_dir }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          INPUT_EXECUTE: ${{ github.event.inputs.execute }}
          INPUT_MIRRORS: ${{ github.event.inputs.mirrors }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/algorithm/check_signing_secret.py
          KEY_ID="${ALGORITHM_SIGNING_KEY_ID:-hzzs-algorithm-official-1}"
          echo "key_id=$KEY_ID"
          export ALGORITHM_SIGNING_PRIVATE_KEY_B64="$(
            python3 -c 'import os; print("".join(os.environ.get("ALGORITHM_SIGNING_PRIVATE_KEY_B64","").split()), end="")'
          )"

          EXECUTE=true
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "${INPUT_EXECUTE:-true}" != "true" ]]; then
            EXECUTE=false
          fi

          MIRRORS="${INPUT_MIRRORS:-}"
          if [[ -z "$MIRRORS" ]]; then
            if [[ -n "${GITEE_TOKEN:-}" ]]; then
              MIRRORS="github,gitee"
            else
              MIRRORS="github"
            fi
          fi
          if [[ "$MIRRORS" == *gitee* && -z "${GITEE_TOKEN:-}" ]]; then
            echo "GITEE_TOKEN missing; falling back to github-only"
            MIRRORS="github"
          fi
          export ALGORITHM_PUBLISH_MIRRORS="$MIRRORS"
          echo "mirrors=$MIRRORS execute=$EXECUTE"

          ARGS=(
            --channel "${INPUT_CHANNEL:-auto}"
            --key-id "$KEY_ID"
            --mirrors "$MIRRORS"
            --work-dir build/algorithm-prepare
            --results-json build/algorithm-prepare/results.json
            --auto-bump
          )
          if [[ -n "${INPUT_SOURCE:-}" ]]; then
            ARGS+=(--source "$INPUT_SOURCE")
          fi
          if [[ "$EXECUTE" == "true" ]]; then
            ARGS+=(--execute)
          fi

          echo "::group::prepare_algorithm_release"
          python3 tools/algorithm/prepare_algorithm_release.py "${ARGS[@]}"
          echo "::endgroup::"
          if [[ -f build/algorithm-prepare/results.json ]]; then
            cat build/algorithm-prepare/results.json
          fi

      - name: Commit auto-bumped pack versions
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- algorithm-packs app/src/main/assets/algorithms; then
            echo "no version tree changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add algorithm-packs app/src/main/assets/algorithms
          git commit -m "chore(algorithm): CI 自动 PATCH 算法包版本"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload local artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algorithm-release
          path: |
            build/algorithm-prepare/
            build/algorithm-release/
          if-no-files-found: ignore
